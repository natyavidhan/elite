services:
  elite:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - elite-data:/data
    environment:
      # Optional shared-secret token. If set, requires a matching
      # VITE_SYNC_TOKEN build arg baked into the image (see README) —
      # tokens are inlined into the frontend bundle at build time, not
      # read at container start.
      - SYNC_TOKEN=
      # Optional — enables the AI Coach tab (backend-only). Read at
      # container start, so changing any of these just needs a restart,
      # not a rebuild. COACH_PROVIDER picks a known-good preset
      # (groq | opencode); COACH_BASE_URL/COACH_MODEL override either
      # independently for a different model or a different OpenAI-
      # compatible provider entirely. See server/.env.example.
      - COACH_PROVIDER=groq
      - COACH_API_KEY=
      # - COACH_BASE_URL=
      # - COACH_MODEL=
    restart: unless-stopped

volumes:
  elite-data:
