<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Elite" />
    <meta name="description" content="Local-first workout, food, cardio, and body weight tracker with a live muscle-volume heatmap." />
    <title>Elite — Training Record</title>
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      (function () {
        var pref = localStorage.getItem('elite:theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Training data is a record you keep, not a lifestyle brand — the
      UI reads as your own marked-up log, gold highlighter over what you did
      today, not an app with charts bolted onto it.
      OWN-WORLD: Dim-white ground (dark charcoal at night, never pure black),
      dark ink text, one gold highlighter for volume intensity and PR marks;
      bold grotesk display type (Archivo), hairline rule dividers, tabular
      monospace for numeric readouts (weight, reps, calories, dates).
      STORY: The user opens Elite and sees today's training as a diagram
      they're actively highlighting — reads as a precise record kept in their
      own hand, not a lifestyle app.
      FIRST VIEWPORT: Workout tab — muscle map centered, numbered margin
      legend of today's muscles by volume, gold wash intensifying with load.
      FORM: Redesign from the original "Anatomical Plate" direction, per an
      explicit user brief pinning the palette (dim white / yellow-gold light,
      near-black charcoal / gold dark) and a font change — executed as "Marked
      Up," a legal-pad-and-highlighter material world, rather than a fresh
      concept-seed round.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
